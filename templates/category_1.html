<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Категория 1</title>

    <!-- Bootstrap -->
    <link href="static/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        body {
            margin: 0;
            background: #f5f6f8;
        }

        .sidebar {
            width: 240px;
            height: 100vh;
            background: #1f232a;
            position: fixed;
            left: 0;
            top: 0;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .sidebar a {
            color: #c7c7c7;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 5px;
        }

        .sidebar a.active {
            background: #2d6cdf;
            color: white;
        }

        .sidebar a:hover {
            background: #2a2f36;
        }

        .content {
            margin-left: 260px;
            padding: 60px;
            display: flex;
            justify-content: center;
        }

        .content-wrapper {
            width: 100%;
            max-width: 1000px;
        }

        .footer-user {
            font-size: 14px;
            color: #aaa;
            font-weight: bold;
        }

        .card {
            text-align: center;
        }

        .user-avatar {
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>

<body>

<!-- Сайдбар -->
<div class="sidebar">

    <div>
        <h5 style="display: flex; align-items: center; gap: 8px;">
            <svg class="bi" width="25px" height="25px" fill="currentColor">
              <use href="/static/images/bootstrap-fill.svg"/>
            </svg>
            Меню
        </h5>

        <hr>

        <a href="/">
            <svg class="bi" width="1em" height="1em" fill="currentColor">
              <use href="/static/images/house-door.svg"/>
            </svg>
            Главная
        </a>

        <a class="active" href="/categories">
            <svg class="bi" width="1em" height="1em" fill="currentColor">
              <use href="/static/images/tags.svg"/>
            </svg>
            Категории
        </a>

        <a href="/orders">
            <svg class="bi" width="1em" height="1em" fill="currentColor">
              <use href="/static/images/cart.svg"/>
            </svg>
            Заказы
        </a>

        <a href="/contacts">
            <svg class="bi" width="1em" height="1em" fill="currentColor">
              <use href="/static/images/person-circle.svg"/>
            </svg>
            Контакты
        </a>
    </div>

    <div>
        <hr>
        <div class="dropdown">
            <a class="dropdown-toggle footer-user" data-bs-toggle="dropdown" style="display: flex; align-items: center; gap: 8px;">
                <img src="/static/images/Herman_AI.webp" alt="Аватар" class="user-avatar" width="30" height="30">
                Пользователь
            </a>
            <ul class="dropdown-menu dropdown-menu-dark">
                <li><a class="dropdown-item" href="/profile">Профиль</a></li>
                <li><a class="dropdown-item" href="/logout">Выход</a></li>
            </ul>
        </div>
    </div>

</div>

<!-- Основная страница -->
<div class="content">



</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
