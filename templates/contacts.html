<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #f5f6f8;
        }

        .sidebar {
            width: 240px;
            height: 100vh;
            background: #1f232a;
            position: fixed;
            left: 0;
            top: 0;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .sidebar a {
            color: #c7c7c7;
            text-decoration: none;
            display: block;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 5px;
        }

        .sidebar a.active {
            background: #2d6cdf;
            color: white;
        }

        .sidebar a:hover {
            background: #2a2f36;
        }

        .content {
            margin-left: 260px;
            padding: 30px;
        }

        .footer-user {
            font-size: 14px;
            color: #aaa;
        }

        .card {
            text-align: center;
        }
    </style>
</head>

<body>

<!-- Сайдбар -->
<div class="sidebar">

    <div>
        <h5>📦 Меню</h5>

        <a href="/">Главная</a>
        <a href="/categories">Категории</a>
        <a href="/orders">Заказы</a>
        <a class="active" href="/contacts">Контакты</a>
    </div>

    <div>
        <div class="dropdown">
            <a class="dropdown-toggle footer-user" data-bs-toggle="dropdown">
                Пользователь
            </a>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Профиль</a></li>
                <li><a class="dropdown-item" href="#">Выход</a></li>
            </ul>
        </div>
    </div>

</div>

<!-- Основная страница -->
<div class="content">



</div>

</body>
</html>
